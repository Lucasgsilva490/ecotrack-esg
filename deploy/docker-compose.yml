# Compose de deploy: usa a imagem JA publicada no GHCR (nao faz build).
# A mesma imagem e usada em staging e producao; so mudam o projeto (-p), o .env e a porta.
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecotrack}
      POSTGRES_USER: ${POSTGRES_USER:-ecotrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ecotrack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ${APP_IMAGE:?APP_IMAGE obrigatoria - informe ghcr.io/usuario/repo:SHA}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ecotrack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecotrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - ecotrack-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:

networks:
  ecotrack-net:
